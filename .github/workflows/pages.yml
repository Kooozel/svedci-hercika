name: Stránka party

on:
  schedule:
    # GitHub plánované běhy v celou hodinu často zpozdí nebo zahodí, proto necelé minuty a záložní běh.
    # 4:17 UTC = 5:17 v zimě (SEČ), 6:17 v létě (SELČ); záloha o hodinu později.
    # Historii uloží jen první běh dne, druhý jen obnoví stránku.
    - cron: "17 4 * * *"
    - cron: "23 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # ranní běh commitne denní historii do history/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # push nesmí zrušit ranní běh dřív, než uloží historii

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: python3 build.py
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
      - name: Uložit denní historii a cache receptů
        # Historii uloží první běh dne, pozdější ji nepřepíšou. GitHub plánované běhy někdy úplně
        # zahodí (13. 11. oba), proto ji uloží i push nebo ruční běh, ale jen do 16:00 českého času,
        # aby se jako "ranní stav" neuložil stav po večerním hraní.
        # cache/static.json (recepty a předměty z API) se commitne, když přibylo něco nového.
        run: |
          day=$(python3 -c "import json; print(json.load(open('site/snapshot.json'))['date'])")
          hour=$(TZ=Europe/Prague date +%-H)
          mkdir -p history
          if [ -f "history/$day.json" ]; then echo "history/$day.json už existuje"
          elif [ "$hour" -ge 16 ]; then echo "po 16:00, historie pro $day se neukládá"
          else cp site/snapshot.json "history/$day.json"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add history cache
          git diff --cached --quiet || { git commit -m "Historie $day" && git pull --rebase && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
