name: Stránka party

on:
  # Bez cronu: GitHub plánované běhy chodily o 7–9 hodin později (14.–19. 11. 2026), 11.–13. 11. vůbec.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # první běh dne commitne denní historii do history/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # push nesmí zrušit běh dřív, než uloží historii

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: python3 build.py
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
      - name: Uložit denní historii a cache receptů
        # Historii uloží první push nebo ruční běh dne, pozdější ji nepřepíšou. Jen do 16:00 českého
        # času, aby se jako "ranní stav" neuložil stav po večerním hraní.
        # cache/static.json (recepty a předměty z API) se commitne, když přibylo něco nového.
        run: |
          day=$(python3 -c "import json; print(json.load(open('site/snapshot.json'))['date'])")
          hour=$(TZ=Europe/Prague date +%-H)
          mkdir -p history
          if [ -f "history/$day.json" ]; then echo "history/$day.json už existuje"
          elif [ "$hour" -ge 16 ]; then echo "po 16:00, historie pro $day se neukládá"
          else cp site/snapshot.json "history/$day.json"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add history cache
          git diff --cached --quiet || { git commit -m "Historie $day" && git pull --rebase && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
