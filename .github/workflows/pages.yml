name: Stránka party

on:
  schedule:
    # 5:00 UTC = 6:00 v zimě (SEČ), 7:00 v létě (SELČ)
    - cron: "0 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # ranní běh commitne denní historii do history/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
      - name: Uložit denní historii
        if: github.event_name == 'schedule'
        run: |
          day=$(python3 -c "import json; print(json.load(open('site/snapshot.json'))['date'])")
          mkdir -p history
          cp site/snapshot.json "history/$day.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || { git commit -m "Historie $day" && git pull --rebase && git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
